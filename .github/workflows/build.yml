name: Build TV app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle :app:assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk tv-home.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: tv-home.apk
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-home.apk --title "Latest build #${{ github.run_number }}" --notes "Built from ${{ github.sha }}"
