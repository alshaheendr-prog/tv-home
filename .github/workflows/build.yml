name: Build TV app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      # The runner image already has the Android SDK; make sure the platform we compile against is there.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build
        run: gradle :app:assembleRelease :adhan:assembleRelease --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -n 60 build.log 2>/dev/null || echo "no build log"; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md
      - name: Rename
        run: |
          cp app/build/outputs/apk/release/app-release.apk tv-home.apk
          cp adhan/build/outputs/apk/release/adhan-release.apk family-adhan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: |
            tv-home.apk
            family-adhan.apk
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tv-home.apk family-adhan.apk --title "Latest build #${{ github.run_number }}" --notes "Built from ${{ github.sha }}"
